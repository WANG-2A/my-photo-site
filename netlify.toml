[build]
  command = "echo 'Static site deployed'"
  publish = "."

# 重定向规则
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/upload"
  to = "/upload.html"
  status = 200

[[redirects]]
  from = "/ai-feedback"
  to = "/ai-feedback.html"
  status = 200

# 环境变量
[build.environment]
  NODE_VERSION = "18"